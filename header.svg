<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Aman Singh — Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#30363d" stroke-width="0.7" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>

  <circle cx="900" cy="65" r="125" fill="#58a6ff" opacity="0.045"/>
  <circle cx="950" cy="250" r="100" fill="#bc8cff" opacity="0.05"/>

  <rect x="0" y="0" width="8" height="300" rx="4" fill="url(#accent)"/>

  <text x="65" y="105"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="48" font-weight="700"
        fill="#f0f6fc">
    Aman Singh
  </text>

  <rect x="67" y="125" width="350" height="3" rx="2" fill="url(#accent)"/>

  <text x="65" y="170"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="25" font-weight="600"
        fill="#58a6ff">
    Full Stack Developer <tspan fill="#bc8cff">&lt;/&gt;</tspan>
  </text>

  <text x="65" y="215"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="17" fill="#c9d1d9">
    Building Scalable Application Architecture
  </text>

  <text x="65" y="243"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="17" fill="#c9d1d9">
    with AI-powered Features &amp; Distributed Systems
  </text>

  <text x="65" y="278"
        font-family="Consolas, monospace"
        font-size="12" letter-spacing="2"
        fill="#8b949e">
    CODE • BUILD • INNOVATE
  </text>
</svg>
